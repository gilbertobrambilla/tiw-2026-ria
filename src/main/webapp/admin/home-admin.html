<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Administrator Home - Project Management</title>
    <link rel="stylesheet" href="../global.css">
    <script src="../scripts/utils.js" defer></script>
    <script src="create-project-structure/state.js" defer></script>
    <script src="create-project-structure/view.js" defer></script>
    <script src="create-project-structure/drag-and-drop.js" defer></script>
    <script src="create-project-structure/orchestrator.js" defer></script>
    <script src="verify-projects/view.js" defer></script>
    <script src="verify-projects/orchestrator.js" defer></script>
    <script src="adminOrchestrator.js" defer></script>
</head>
<body>

<div class="navbar">
    <span id="adminGreeting">Welcome, Administrator</span>
    <div class="nav-links">
        <a id="logoutLink" href="../logout">Logout</a>
    </div>
</div>

<div class="wrapper admin-page">
    <div id="createProjectStructure-box" class="row admin-box">
        <div class="full-width">
            <div class="title-line">
                <h3>Create Project</h3>
                <div class="title-buttons">
                    <button id="createProjectStructure-undoButton" type="button" class="btn" disabled>UNDO</button>
                    <button id="createProjectStructure-redoButton" type="button" class="btn" disabled>REDO</button>
                </div>
            </div>

            <form id="createProjectStructure-projectHeaderForm" autocomplete="off">
                <div class="project-header-line">
                    <fieldset id="createProjectStructure-projectHeaderFields" class="project-header-fields" disabled>
                        <input id="createProjectStructure-projectTitleInput" name="title" type="text" placeholder="Project Title" maxlength="100" required>
                        <input id="createProjectStructure-projectDurationInput" name="durationMonths" type="text" placeholder="Duration" inputmode="numeric" required>
                        <select id="createProjectStructure-projectManagerSelect" name="managedBy" required>
                            <option value="0" selected disabled>-- Select Technical User --</option>
                        </select>
                        <button id="createProjectStructure-enterStructurePhaseButton" type="button" class="btn project-header-next">NEXT</button>
                    </fieldset>
                </div>

                <div id="createProjectStructure-projectHeaderError" class="error-message hidden">Project header is not valid.</div>
            </form>

            <div id="createProjectStructure-projectStructurePanel" class="project-structure-panel hidden">
                <div class="structure-title-line">
                    <h3>Project Structure</h3>
                </div>

                <div id="createProjectStructure-projectStructureWPList" class="project-structure-wp-list">
                </div>

                <div class="right-actions">
                    <button id="createProjectStructure-addWPButton" type="button" class="btn">+ WP</button>
                </div>

                <div class="save-line">
                    <button id="createProjectStructure-saveProjectStructureButton" type="button" class="btn">SAVE PROJECT</button>
                </div>

                <div id="createProjectStructure-projectStructureError" class="error-message hidden">Project structure is not valid.</div>
            </div>

            <div id="createProjectStructure-success" class="success-message hidden">Project structure saved successfully.</div>
        </div>
    </div>

    <div id="verifyProjects-box" class="row split">
        <div class="side">
            <h3>Your Projects</h3>
            <div id="verifyProjects-projectList" class="project-list">
            </div>
            <div id="verifyProjects-error" class="error-message hidden">Unable to load the selected project structure.</div>
        </div>

        <div id="verifyProjects-projectViewer" class="viewer hidden">
            <h3>Project Structure</h3>
            <div id="verifyProjects-projectTree" class="project-tree">
            </div>
        </div>
    </div>
</div>

</body>
</html>
